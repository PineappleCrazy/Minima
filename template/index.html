<!DOCTYPE html>
<html>
<head>
    <title>Minima</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="card">
    <h1>Minima</h1>

    <label>Aerodrome</label>
    <select id="airport" onchange="loadRunways(); updateCheckButton();">
        <option value="">Select Aerodrome</option>
    </select>

    <label>Runway</label>
    <select id="runway" disabled onchange="loadApproaches(); updateCheckButton();">
        <option value="">Select Runway</option>
    </select>

    <label>Aircraft</label>
    <select id="aircraft" onchange="updateCheckButton()">
        <option value="">Select aircraft</option>
    </select>

    <label>Approach</label>
    <select id="approach" disabled onchange="updateCheckButton()">
        <option value="">Select approach</option>
    </select>

    <button id="checkBtn" onclick="checkMinima()" disabled>
        Check Minima
    </button>

    <div id="result" class="result"></div>
</div>

<script>
async function checkMinima() {
    const response = await fetch("/minima", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            airport: airport.value,
            runway: runway.value,
            aircraft: aircraft.value,
            approach: approach.value
        })
    });

    const data = await response.json();

    if (data.error) {
        result.innerHTML = `<p class="error">${data.error}</p>`;
        return;
    }

    result.className = "result";

    if (data.status.includes("BELOW")) {
        result.classList.add("red");
    } else if (data.status.includes("ABOVE")) {
        result.classList.add("green");
    } else {
        result.classList.add("neutral");
    }

    result.innerHTML = `
        <p><strong>Status:</strong> ${data.status}</p>
        <p><strong>Required:</strong> ${data.required} m</p>
        <p><strong>Actual:</strong> ${data.visibility} m</p>
        <pre>${data.metar}</pre>
    `;
}

window.onload = () => {
    loadAirports();
    loadAircraft();
};

async function loadAirports() {
    const res = await fetch("/airports");
    const airports = await res.json();

    const select = document.getElementById("airport");
    select.innerHTML = '<option value="">Select airport</option>';

    airports.forEach(a => {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        select.appendChild(opt);
    });
}

async function loadRunways() {
    const airport = document.getElementById("airport").value;
    const runwaySelect = document.getElementById("runway");
    const approachSelect = document.getElementById("approach");

    runwaySelect.disabled = true;
    runwaySelect.innerHTML = '<option value="">Select runway</option>';
    approachSelect.disabled = true;
    approachSelect.innerHTML = '<option value="">Select approach</option>';

    if (!airport) {
        updateCheckButton();
        return;
    }

    try {
        const res = await fetch(`/runways?airport=${airport}`);

        if (!res.ok) {
            console.error("Runways fetch failed:", res.status);
            return;
        }

        const runways = await res.json();
        console.log("Runways:", runways);

        runways.forEach(rw => {
            const opt = document.createElement("option");
            opt.value = rw;
            opt.textContent = rw;
            runwaySelect.appendChild(opt);
        });

        runwaySelect.disabled = false;
    } catch (err) {
        console.error("Runways error:", err);
    }

    updateCheckButton();
}


async function loadApproaches() {
    const airport = document.getElementById("airport").value;
    const runway = document.getElementById("runway").value;
    const approachSelect = document.getElementById("approach");

    approachSelect.disabled = true;
    approachSelect.innerHTML = '<option value="">Select approach</option>';

    if (!airport || !runway) {
        updateCheckButton();
        return;
    }

    try {
        const res = await fetch(
            `/approaches?airport=${airport}&runway=${runway}`
        );

        if (!res.ok) {
            console.error("Approaches fetch failed:", res.status);
            return;
        }

        const approaches = await res.json();
        console.log("Approaches:", approaches);

        approaches.forEach(ap => {
            const opt = document.createElement("option");
            opt.value = ap.value;
            opt.textContent = ap.label;
            approachSelect.appendChild(opt);
        });

        approachSelect.disabled = false;
    } catch (err) {
        console.error("Approaches error:", err);
    }

    updateCheckButton();
}


async function loadAircraft() {
    const res = await fetch("/aircraft");
    const aircraft = await res.json();

    const select = document.getElementById("aircraft");
    select.innerHTML = '<option value="">Select aircraft</option>';

    aircraft.forEach(ac => {
        const opt = document.createElement("option");
        opt.value = ac;
        opt.textContent = ac;
        select.appendChild(opt);
    });
}

function updateCheckButton() {
    const airport = document.getElementById("airport").value;
    const runway = document.getElementById("runway").value;
    const approach = document.getElementById("approach").value;
    const aircraft = document.getElementById("aircraft").value;

    const button = document.getElementById("checkBtn");

    button.disabled = !(airport && runway && approach && aircraft);
}

</script>



</body>
</html>
